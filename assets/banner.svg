<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0d1527;#090d16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14">
        <animate attributeName="stop-color" values="#080c14;#131b2e;#080c14" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft glow -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="660" y1="0" x2="660" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="1020" y1="0" x2="1020" y2="380" />
  </g>

  <!-- Ambient Dynamic Glow Orbs in Background -->
  <circle cx="200" cy="180" r="140" fill="url(#glowEffect)" filter="url(#blurGlow)">
    <animate attributeName="cx" values="180;220;180" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="190" r="150" fill="url(#glowEffect)" filter="url(#blurGlow)">
    <animate attributeName="cx" values="1020;980;1020" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Interactive Dynamic Token Reduction Visualization Pipeline (Behind Text/Bottom) -->
  <g transform="translate(150, 280)">
    <!-- Rail Line -->
    <rect x="0" y="16" width="900" height="4" rx="2" fill="url(#streamGrad)" opacity="0.6"/>

    <!-- Left Box: Raw Context -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
      <text x="85" y="22" fill="#fca5a5" font-size="12" text-anchor="middle" class="font-mono">RAW CONTEXT: 128k</text>
    </g>

    <!-- Center Optimization Engine Node -->
    <g transform="translate(365, -8)">
      <rect x="0" y="0" width="170" height="52" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="85" y="24" fill="#a5b4fc" font-size="11" text-anchor="middle" class="font-mono">REDUCTION ENGINE</text>
      <text x="85" y="42" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" class="font-mono">⚡ 70% - 90% CUT</text>
      <!-- Pulsing ring around engine -->
      <circle cx="85" cy="26" r="32" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4">
        <animate attributeName="r" values="30;42;30" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Right Box: Compressed Output -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
      <text x="85" y="22" fill="#6ee7b7" font-size="12" text-anchor="middle" class="font-mono">LEAN TOKENS: 14k</text>
    </g>

    <!-- Animated Flowing Token Particles -->
    <circle cx="180" cy="18" r="4.5" fill="#ef4444">
      <animate attributeName="cx" values="180;360" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="270" cy="18" r="3.5" fill="#f59e0b">
      <animate attributeName="cx" values="180;360" dur="2.2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="18" r="4.5" fill="#10b981">
      <animate attributeName="cx" values="540;720" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="630" cy="18" r="3.5" fill="#06b6d4">
      <animate attributeName="cx" values="540;720" dur="2s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Badges / Chips -->
  <g transform="translate(0, 48)">
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75" y="18" fill="#94a3b8" font-size="11" text-anchor="middle" class="font-mono">⚡ CONTEXT PRUNING</text>
    </g>
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="85" y="18" fill="#94a3b8" font-size="11" text-anchor="middle" class="font-mono">🛡️ SEMANTIC CACHING</text>
    </g>
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80" y="18" fill="#94a3b8" font-size="11" text-anchor="middle" class="font-mono">📦 PROMPT COMPACTION</text>
    </g>
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="85" y="18" fill="#94a3b8" font-size="11" text-anchor="middle" class="font-mono">🚀 TERMINAL PROXIES</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT (Crisp, High-Contrast, Never Obscured) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGrad)" font-size="44" letter-spacing="-0.5" class="font-title">
      AWESOME LLM TOKEN USAGE REDUCER
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" fill="#f8fafc" font-size="20" class="font-sub" opacity="0.95">
      The Curated Ecosystem for Context Compression, CLI Filtering &amp; Prompt Efficiency
    </text>

    <!-- Secondary Explanatory Line -->
    <text x="600" y="232" fill="#94a3b8" font-size="14.5" class="font-sub">
      Save 60%–90% on LLM API costs • Prevent context pollution • Accelerate AI agent workflows
    </text>
  </g>

  <!-- Outer Border Stroke -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7"/>
</svg>
